<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MARXi — Chat AI</title>
  <link rel="stylesheet" href="../styles/global.css"/>
  <link rel="stylesheet" href="../styles/app.css"/>
</head>
<body class="grid-bg">
<div class="app-shell" id="appRoot"></div>

<script type="module">
  import { renderShell } from "../js/appshell.js";
  import { initShell, toast, updateUsagePill } from "../js/shell.js";
  import { incrementUsage, canUse, getKeys } from "../js/firebase.js";

  renderShell({ title: "Chat AI", page: "chat" });

  const { user, userData, limits } = await initShell("chat");

  // ── State ──────────────────────────────────────────────
  let history = [];
  let attachedFiles = [];
  let isGenerating = false;

  // ── Inject chat UI into pageContent ───────────────────
  document.getElementById("pageContent").innerHTML = `
    <div class="chat-wrap">
      <div class="chat-messages" id="chatMessages">
        <div class="msg-row">
          <div class="msg-avatar ai">M</div>
          <div class="msg-bubble ai">
            👋 Hey <strong>${user.displayName?.split(" ")[0] || "there"}</strong>! I'm <strong>MARXi</strong> — your AI agent.
            I can chat, write code, improve prompts, and more. What are we building today?
          </div>
        </div>
      </div>
      <div class="chat-input-area">
        <div class="attach-preview" id="attachPreview"></div>
        <div class="input-box">
          <div class="input-actions">
            <button class="input-action-btn" title="Attach file" onclick="document.getElementById('fileIn').click()">📎</button>
            <input type="file" id="fileIn" style="display:none" accept="image/*,.pdf,.txt" onchange="attachFile(this)"/>
            <button class="input-action-btn" title="Improve prompt" onclick="quickImprove()" id="improveBtn">✨</button>
          </div>
          <textarea class="chat-textarea" id="chatInput"
            placeholder="Ask MARXi anything…" rows="1"
            oninput="autoResize(this)"
            onkeydown="handleKey(event)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
        <div class="hint-chips">
          <span class="hint-chip" onclick="useHint(this)">Write a React component</span>
          <span class="hint-chip" onclick="useHint(this)">Explain how async/await works</span>
          <span class="hint-chip" onclick="useHint(this)">Help me debug my code</span>
          <span class="hint-chip" onclick="useHint(this)">Write a professional email</span>
        </div>
      </div>
    </div>`;

  // ── Helpers ────────────────────────────────────────────
  window.autoResize = el => {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 140) + "px";
  };
  window.handleKey = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
  window.useHint   = el => { document.getElementById("chatInput").value = el.textContent; sendMessage(); };

  // ── File attach ────────────────────────────────────────
  window.attachFile = input => {
    const file = input.files[0]; if (!file) return;
    if (userData.plan !== "pro") {
      toast("File uploads require Pro plan.", "error"); return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      attachedFiles.push({ name: file.name, type: file.type, data: e.target.result });
      renderAttachPreview();
    };
    file.type.startsWith("image/") ? reader.readAsDataURL(file) : reader.readAsText(file);
    input.value = "";
  };

  function renderAttachPreview() {
    document.getElementById("attachPreview").innerHTML = attachedFiles.map((f, i) => `
      <div class="attach-item">
        ${f.type.startsWith("image/") ? `<img src="${f.data}"/>` : "📄"}
        <span>${f.name}</span>
        <span class="attach-remove" onclick="removeAttach(${i})">✕</span>
      </div>`).join("");
  }
  window.removeAttach = i => { attachedFiles.splice(i, 1); renderAttachPreview(); };

  // ── Send message ───────────────────────────────────────
  window.sendMessage = async () => {
    if (isGenerating) return;
    const input = document.getElementById("chatInput");
    const text  = input.value.trim();
    if (!text && !attachedFiles.length) return;

    if (!canUse("chats", userData, limits)) {
      toast("Daily chat limit reached. Upgrade for unlimited!", "error"); return;
    }

    const msgText = text || "[File attached]";
    appendMsg("usr", msgText);
    input.value = ""; autoResize(input);
    clearAttachPreview();
    history.push({ role: "user", content: msgText });

    isGenerating = true;
    document.getElementById("sendBtn").disabled = true;
    appendTyping();

    await incrementUsage(user.uid, "chats", userData);
    updateUsagePill(userData, limits);

    try {
      const keys = await getKeys();
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${keys.groq}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          messages: [
            { role: "system", content: "You are MARXi, an advanced AI assistant. You are helpful, precise, and creative. When writing code always use markdown code blocks with the correct language tag. Be concise and action-oriented." },
            ...history.slice(-14)
          ],
          max_tokens: 1500,
          temperature: 0.7
        })
      });
      const data = await res.json();
      removeTyping();
      const reply = data.choices?.[0]?.message?.content || "I had trouble responding. Please try again.";
      history.push({ role: "assistant", content: reply });
      appendMsg("ai", reply, true);
    } catch(e) {
      removeTyping();
      appendMsg("ai", "⚠️ Connection error. Check your Groq API key.");
      toast("API error", "error");
    }

    isGenerating = false;
    document.getElementById("sendBtn").disabled = false;
  };

  // ── Quick prompt improve ───────────────────────────────
  window.quickImprove = async () => {
    const input = document.getElementById("chatInput");
    const text  = input.value.trim();
    if (!text) { toast("Type a prompt first then click ✨"); return; }
    const btn = document.getElementById("improveBtn");
    btn.style.color = "var(--accent)";
    try {
      const keys = await getKeys();
      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": `Bearer ${keys.groq}`, "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          messages: [
            { role: "system", content: "You are an expert prompt engineer. Rewrite the user prompt to be more specific and detailed to get better AI outputs. Return ONLY the improved prompt, nothing else." },
            { role: "user", content: text }
          ],
          max_tokens: 300
        })
      });
      const data = await res.json();
      const improved = data.choices?.[0]?.message?.content;
      if (improved) { input.value = improved; autoResize(input); toast("✨ Prompt improved!"); }
    } catch { toast("Improve failed", "error"); }
    btn.style.color = "";
  };

  // ── DOM helpers ────────────────────────────────────────
  function appendMsg(role, text, md = false) {
    const msgs = document.getElementById("chatMessages");
    const row  = document.createElement("div");
    row.className = `msg-row${role === "usr" ? " user" : ""}`;
    const initial = role === "ai" ? "M" : (user.displayName || "U")[0].toUpperCase();
    row.innerHTML = `
      <div class="msg-avatar ${role}">${initial}</div>
      <div class="msg-bubble ${role}">${md ? mdToHtml(text) : escHtml(text)}</div>`;
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function appendTyping() {
    const msgs = document.getElementById("chatMessages");
    const row  = document.createElement("div");
    row.id = "typingRow"; row.className = "msg-row";
    row.innerHTML = `<div class="msg-avatar ai">M</div>
      <div class="msg-bubble ai"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
    msgs.appendChild(row); msgs.scrollTop = msgs.scrollHeight;
  }
  function removeTyping() { document.getElementById("typingRow")?.remove(); }
  function clearAttachPreview() { attachedFiles = []; document.getElementById("attachPreview").innerHTML = ""; }

  function mdToHtml(text) {
    return text
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/```(\w*)\n([\s\S]*?)```/g, (_,l,c)=>`<pre><code>${c.trim()}</code></pre>`)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
      .replace(/\*(.*?)\*/g, "<em>$1</em>")
      .replace(/\n/g, "<br>");
  }
  function escHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MARXi — Sign In</title>
  <link rel="stylesheet" href="styles/global.css"/>
  <link rel="stylesheet" href="styles/auth.css"/>
</head>
<body class="grid-bg">

<div class="auth-page">
  <a href="index.html" class="auth-logo">MAR<span>Xi</span></a>

  <div class="auth-card">
    <div class="auth-card-glow"></div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">Log In</button>
      <button class="auth-tab" id="tabSignup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Message box -->
    <div class="auth-msg" id="msgBox"></div>

    <!-- Login Form -->
    <div id="loginForm">
      <div class="form-group">
        <label class="input-label">Email</label>
        <input class="input" type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="input-label">Password</label>
        <input class="input" type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn btn-primary w-full" id="loginBtn" onclick="handleLogin()" style="padding:13px">
        Log In
      </button>
      <div class="auth-divider"><span>or</span></div>
      <button class="btn-google" onclick="handleGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
    </div>

    <!-- Signup Form -->
    <div id="signupForm" style="display:none">
      <div class="form-group">
        <label class="input-label">Full Name</label>
        <input class="input" type="text" id="signupName" placeholder="Your Name" autocomplete="name"/>
      </div>
      <div class="form-group">
        <label class="input-label">Email</label>
        <input class="input" type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="input-label">Password</label>
        <input class="input" type="password" id="signupPass" placeholder="Min 6 characters" autocomplete="new-password"/>
      </div>
      <button class="btn btn-primary w-full" id="signupBtn" onclick="handleSignup()" style="padding:13px">
        Create Account
      </button>
      <div class="auth-divider"><span>or</span></div>
      <button class="btn-google" onclick="handleGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
    </div>

    <p class="auth-back"><a href="index.html">← Back to MARXi</a></p>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    GoogleAuthProvider, signInWithPopup, updateProfile, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBVBQEPnYOTbkkfPKAqO6aYnVs29GSpId8",
    authDomain: "marxi-b1562.firebaseapp.com",
    projectId: "marxi-b1562",
    storageBucket: "marxi-b1562.firebasestorage.app",
    messagingSenderId: "702306346639",
    appId: "1:702306346639:web:01a30dc5f19f0751e172fa"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // Already logged in → go to app
  onAuthStateChanged(auth, user => {
    if (user) location.href = "app/chat.html";
  });

  // Init tab from URL
  const params = new URLSearchParams(location.search);
  if (params.get("mode") === "signup") switchTab("signup");

  function showMsg(text, type = "error") {
    const box = document.getElementById("msgBox");
    box.textContent = text;
    box.className = "auth-msg show " + type;
    clearTimeout(box._t);
    box._t = setTimeout(() => box.className = "auth-msg", 4000);
  }

  function setLoading(id, loading, original) {
    const btn = document.getElementById(id);
    btn.disabled = loading;
    btn.innerHTML = loading
      ? `<span class="spinner" style="border-top-color:#000"></span> Please wait…`
      : original;
  }

  async function createUserDoc(user, name = "") {
    const ref = doc(db, "users", user.uid);
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, {
        uid: user.uid,
        name: name || user.displayName || "User",
        email: user.email,
        plan: "free",
        usage: { chats:0, images:0, websites:0, videos:0, lastReset: new Date().toDateString() },
        createdAt: serverTimestamp()
      });
    }
  }

  window.switchTab = function(tab) {
    const isLogin = tab === "login";
    document.getElementById("loginForm").style.display  = isLogin ? "block" : "none";
    document.getElementById("signupForm").style.display = isLogin ? "none"  : "block";
    document.getElementById("tabLogin").classList.toggle("active",  isLogin);
    document.getElementById("tabSignup").classList.toggle("active", !isLogin);
  };

  window.handleLogin = async function() {
    const email = document.getElementById("loginEmail").value.trim();
    const pass  = document.getElementById("loginPass").value;
    if (!email || !pass) return showMsg("Please fill in all fields.");
    setLoading("loginBtn", true, "Log In");
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      location.href = "app/chat.html";
    } catch(e) {
      showMsg(e.code === "auth/invalid-credential" ? "Wrong email or password." : e.message);
      setLoading("loginBtn", false, "Log In");
    }
  };

  window.handleSignup = async function() {
    const name  = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const pass  = document.getElementById("signupPass").value;
    if (!name || !email || !pass) return showMsg("Please fill in all fields.");
    if (pass.length < 6) return showMsg("Password must be at least 6 characters.");
    setLoading("signupBtn", true, "Create Account");
    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      await createUserDoc(cred.user, name);
      location.href = "app/chat.html";
    } catch(e) {
      showMsg(e.code === "auth/email-already-in-use" ? "Email already registered." : e.message);
      setLoading("signupBtn", false, "Create Account");
    }
  };

  window.handleGoogle = async function() {
    try {
      const cred = await signInWithPopup(auth, new GoogleAuthProvider());
      await createUserDoc(cred.user);
      location.href = "app/chat.html";
    } catch(e) {
      showMsg("Google sign-in failed. Try again.");
    }
  };
</script>
</body>
</html>
